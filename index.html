/* Computes the touch button layout (positions + metadata) without drawing.
   Used by drawTouchControls() and by computeFocusGaugeBounds() so the Focus
   gauge can avoid overlapping any visible touch controls. */
function computeTouchButtonDefs() {
  const focusReady = state.zone >= 25 || state.zoneActive;
  const m = getTouchLayoutMetrics();
  const layout = settings.touchLayout || 'default';
  const buttons = [];

  if (isPortrait) {
    if (layout === 'split') {
      buttons.push(
        { id: 'hold', label: 'HOLD', sub: 'SWAP', x: m.leftClusterX, y: m.topY, w: m.clusterW, h: m.row1H, action: 'hold' },
        CONFIG.zoneEnabled ? { id: 'zone', label: state.zoneActive ? 'END' : 'FOCUS', sub: `${Math.floor(state.zone / 25)}/4`, x: m.rightClusterX, y: m.topY, w: m.clusterW, h: m.row1H, action: 'zone', glow: focusReady } : null
      );
      const row2Y = m.topY + m.row1H + 8;
      const row3Y = row2Y + m.dpadH + 8;
      buttons.push(
        { id: 'left',  label: '◀', sub: 'LEFT',  x: m.leftClusterX,              y: row2Y, w: m.btnW, h: m.dpadH, hold: 'left' },
        { id: 'right', label: '▶', sub: 'RIGHT', x: m.leftClusterX + m.btnW + 8, y: row2Y, w: m.btnW, h: m.dpadH, hold: 'right' },
        { id: 'down',  label: '▼', sub: 'SOFT',  x: m.leftClusterX,              y: row3Y, w: m.btnW, h: m.dpadH, hold: 'down' },
        { id: 'drop',  label: '⤓', sub: 'DROP',  x: m.leftClusterX + m.btnW + 8, y: row3Y, w: m.btnW, h: m.dpadH, action: 'drop' }
      );
      buttons.push(
        { id: 'ccw', label: '↺', sub: 'CCW', x: m.rightClusterX,              y: row2Y, w: m.btnW, h: m.rotH, action: 'ccw' },
        { id: 'cw',  label: '↻', sub: 'CW',  x: m.rightClusterX + m.btnW + 8, y: row2Y, w: m.btnW, h: m.rotH, action: 'cw' }
      );
    } else if (layout === 'compact') {
      const topY = m.topY;
      const btnW = m.btnW;
      buttons.push(
        { id: 'left',  label: '◀', sub: 'LEFT', x: m.sideMargin,               y: topY, w: btnW, h: m.dpadH, hold: 'left' },
        { id: 'right', label: '▶', sub: 'RIGHT',x: m.sideMargin + btnW + 4,    y: topY, w: btnW, h: m.dpadH, hold: 'right' },
        { id: 'down',  label: '▼', sub: 'SOFT', x: m.sideMargin + (btnW+4)*2,  y: topY, w: btnW, h: m.dpadH, hold: 'down' },
        { id: 'drop',  label: '⤓', sub: 'DROP', x: m.sideMargin + (btnW+4)*3,  y: topY, w: btnW, h: m.dpadH, action: 'drop' }
      );
      const row2Y = topY + m.dpadH + 8;
      const halfW = Math.floor((m.clusterW - 8) / 4);
      buttons.push(
        { id: 'hold', label: 'HOLD', sub: 'SWAP', x: m.sideMargin,               y: row2Y, w: halfW * 2, h: m.row1H, action: 'hold' },
        { id: 'ccw',  label: '↺',  sub: 'CCW',  x: m.sideMargin + halfW * 2 + 8, y: row2Y, w: halfW,     h: m.row1H, action: 'ccw' },
        { id: 'cw',   label: '↻',  sub: 'CW',   x: m.sideMargin + halfW * 3 + 8, y: row2Y, w: halfW,     h: m.row1H, action: 'cw' }
      );
    } else {
      buttons.push(
        { id: 'hold', label: 'HOLD', sub: 'SWAP PIECE', x: m.sideMargin, y: m.topY, w: m.clusterW, h: m.row1H, action: 'hold' },
        CONFIG.zoneEnabled ? { id: 'zone', label: state.zoneActive ? 'END FOCUS' : 'FOCUS', sub: `${Math.floor(state.zone / 25)}/4 CHARGE`, x: m.rightClusterX, y: m.topY, w: m.clusterW, h: m.row1H, action: 'zone', glow: focusReady } : null
      );
      const row2Y = m.topY + m.row1H + 10;
      const row3Y = row2Y + m.dpadH + 10;
      buttons.push(
        { id: 'left',  label: '◀', sub: 'LEFT',  x: m.sideMargin,              y: row2Y, w: m.btnW, h: m.dpadH, hold: 'left' },
        { id: 'right', label: '▶', sub: 'RIGHT', x: m.sideMargin + m.btnW + 10, y: row2Y, w: m.btnW, h: m.dpadH, hold: 'right' },
        { id: 'down',  label: '▼', sub: 'SOFT',  x: m.sideMargin,              y: row3Y, w: m.btnW, h: m.dpadH, hold: 'down' },
        { id: 'drop',  label: '⤓', sub: 'DROP',  x: m.sideMargin + m.btnW + 10, y: row3Y, w: m.btnW, h: m.dpadH, action: 'drop' }
      );
      buttons.push(
        { id: 'ccw', label: '↺', sub: 'ROT CCW', x: m.rightClusterX,              y: row2Y, w: m.btnW, h: m.rotH, action: 'ccw' },
        { id: 'cw',  label: '↻', sub: 'ROT CW',  x: m.rightClusterX + m.btnW + 10, y: row2Y, w: m.btnW, h: m.rotH, action: 'cw' }
      );
    }
  } else {
    const row2Y = m.baseY + m.row1H + 8;
    const row3Y = row2Y + m.dpadH + 8;
    buttons.push(
      { id: 'hold',  label: 'HOLD', sub: 'LEFT SIDE', x: m.leftX, y: m.baseY, w: m.clusterW, h: m.row1H, action: 'hold' },
      { id: 'left',  label: '◀', sub: 'LEFT',  x: m.leftX,             y: row2Y, w: m.btnW, h: m.dpadH, hold: 'left' },
      { id: 'right', label: '▶', sub: 'RIGHT', x: m.leftX + m.btnW + 8, y: row2Y, w: m.btnW, h: m.dpadH, hold: 'right' },
      { id: 'down',  label: '▼', sub: 'SOFT',  x: m.leftX,             y: row3Y, w: m.btnW, h: m.dpadH, hold: 'down' },
      { id: 'drop',  label: '⤓', sub: 'DROP',  x: m.leftX + m.btnW + 8, y: row3Y, w: m.btnW, h: m.dpadH, action: 'drop' },
      CONFIG.zoneEnabled ? { id: 'zone',  label: state.zoneActive ? 'END FOCUS' : 'FOCUS', sub: `${Math.floor(state.zone / 25)}/4`, x: m.rightX, y: m.baseY, w: m.clusterW, h: m.row1H, action: 'zone', glow: focusReady } : null,
      { id: 'ccw',   label: '↺', sub: 'ROT CCW', x: m.rightX,             y: row2Y, w: m.btnW, h: m.rotH, action: 'ccw' },
      { id: 'cw',    label: '↻', sub: 'ROT CW',  x: m.rightX + m.btnW + 8, y: row2Y, w: m.btnW, h: m.rotH, action: 'cw' }
    );
  }

  const filtered = buttons.filter(Boolean);

  // Apply custom saved positions (normalized 0..1 coordinates) if present
  const orientKey = isPortrait ? 'portrait' : 'landscape';
  const savedMap = (customTouchPositions && customTouchPositions[orientKey]) || {};
  for (const b of filtered) {
    if (savedMap[b.id]) {
      b.x = Math.max(4, Math.min(W - b.w - 4, Math.round(savedMap[b.id].nx * W)));
      b.y = Math.max(4, Math.min(H - b.h - 4, Math.round(savedMap[b.id].ny * H)));
    }
  }
  return filtered;
}

function drawTouchControls() {
  touchPadButtons = [];
  if (!isTouchVisible() && !touchEditorOpen) return;
  if (!touchEditorOpen && state.phase !== 'playing' && state.phase !== 'countdown') return;
  if (!touchEditorOpen && (settingsOpen || highScoresOpen)) return;

  const pal = PALETTES[settings.paletteIdx];
  const bw = isBwTheme();
  touchPadButtons = computeTouchButtonDefs();

  for (const b of touchPadButtons) {
    const isActive = (b.hold && touchHeld[b.hold]) || hoverBtnId === `touch_${b.id}` || draggingTouchBtnId === b.id;
    ctx.save();
    roundRect(b.x, b.y, b.w, b.h, bw ? 3 : 14);
    if (bw) {
      ctx.fillStyle = isActive ? '#ffffff' : '#000000';
      ctx.fill();
      ctx.lineWidth = isActive ? 2.5 : 1.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    } else {
      if (b.glow) {
        ctx.fillStyle = isActive ? 'rgba(200,90,255,0.42)' : 'rgba(160,60,255,0.22)';
        ctx.shadowColor = pal.zone;
        ctx.shadowBlur = 14;
      } else {
        ctx.fillStyle = isActive
          ? 'rgba(90,165,255,0.34)'
          : (settings.oled ? 'rgba(14,18,30,0.92)' : 'rgba(20,30,58,0.75)');
      }
      ctx.fill();
      ctx.lineWidth = isActive ? 2.4 : 1.6;
      ctx.strokeStyle = b.glow
        ? pal.zone
        : (isActive ? pal.accent : 'rgba(140,185,255,0.35)');
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    ctx.textAlign = 'center';
    ctx.font = `800 ${b.label.length > 3 ? 14 : 26}px system-ui, sans-serif`;
    ctx.fillStyle = (bw && isActive) ? '#000000' : '#f0f6ff';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + (b.sub ? 0 : 8));

    if (b.sub) {

function drawToast() {
  if (!state.toast || state.toastTimer <= 0) return;
  const bw = isBwTheme();
  const pal = PALETTES[settings.paletteIdx];
  const a = bw ? 1 : Math.min(1, state.toastTimer * 1.6);

  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '700 12px system-ui, sans-serif';
  const textW = Math.ceil(ctx.measureText(state.toast).width);
  const pillW = Math.max(132, textW + 24);
  const pillH = 26;
  const bx = BOARD_X + Math.floor((BOARD_W - pillW) / 2);
  const by = Math.max(4, BOARD_Y - 7 - pillH - 6);

  roundRect(bx, by, pillW, pillH, bw ? 2 : 6);
  if (bw) {
    ctx.fillStyle = '#000000';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
  } else if (state.zoneActive) {
    ctx.fillStyle = 'rgba(200,90,255,0.16)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(210,120,255,0.5)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = '#d68cff';
  } else if (isMonoTheme()) {
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.strokeStyle = pal.accent;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = pal.accent;
  } else {
    ctx.fillStyle = 'rgba(255,180,60,0.16)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,190,80,0.5)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = '#ffc857';
  }

  ctx.textAlign = 'center';
  ctx.fillText(state.toast, bx + pillW / 2, by + 17);
  ctx.restore();
}

function drawButtonLabelWithBigIcon(label, centerX, baselineY, baseFontSize, color) {
  const match = label.match(/^([↻↺⚙⌂▶🏆✓✕←])\s+(.+)$/);
  if (!match) {
    ctx.textAlign = 'center';
    ctx.font = `800 ${baseFontSize}px system-ui, sans-serif`;
    ctx.fillStyle = color;
    ctx.fillText(label, centerX, baselineY);
    return;
  }
  const icon = match[1];
  const rest = match[2];
  const iconSize = baseFontSize + 6;
  const gap = 8;

  ctx.save();
  ctx.font = `900 ${iconSize}px system-ui, sans-serif`;
  const iconW = ctx.measureText(icon).width;
  ctx.font = `800 ${baseFontSize}px system-ui, sans-serif`;
  const textW = ctx.measureText(rest).width;
  const totalW = iconW + gap + textW;
  const startX = centerX - totalW / 2;

  ctx.textAlign = 'left';
  ctx.fillStyle = color;
  ctx.font = `900 ${iconSize}px system-ui, sans-serif`;
  ctx.strokeStyle = color;
  ctx.lineWidth = 0.9;
  ctx.strokeText(icon, startX, baselineY + 2);
  ctx.fillText(icon, startX, baselineY + 2);

  ctx.font = `800 ${baseFontSize}px system-ui, sans-serif`;
  ctx.fillText(rest, startX + iconW + gap, baselineY);
  ctx.restore();
}

function drawPillButton(id, label, subLabel, x, y, w, h, active, primary, onClick, dpadFocused = false, disabled = false) {
  const pal = PALETTES[settings.paletteIdx];
  const bw = isBwTheme();
  const hovered = !disabled && (hoverBtnId === id || dpadFocused);
  ctx.save();
  if (disabled && !bw) ctx.globalAlpha = 0.38;
  roundRect(x, y, w, h, bw ? 3 : 12);

  if (bw) {
    const inv = primary || active || hovered;
    ctx.fillStyle = inv ? '#ffffff' : '#000000';
    ctx.fill();
    ctx.lineWidth = dpadFocused ? 3 : 1.8;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    const fg = inv ? '#000000' : '#ffffff';
    drawButtonLabelWithBigIcon(label, x + w / 2, y + h / 2 + (subLabel ? -2 : 5), primary ? 17 : 14, fg);
    if (subLabel) {
      ctx.textAlign = 'center';
      ctx.font = '600 10px ui-monospace, monospace';
      ctx.fillStyle = fg;
      ctx.fillText(subLabel, x + w / 2, y + h / 2 + 13);
    }
    if (dpadFocused) {
      roundRect(x - 3, y - 3, w + 6, h + 6, 4);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
    if (!disabled) registerButton(id, x, y, w, h, onClick);
    return;
  }

  if (primary) {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, pal.accent);
    g.addColorStop(1, pal.secondary);
    ctx.fillStyle = g;
  } else if (active) {
    ctx.fillStyle = settings.oled ? 'rgba(46,230,230,0.22)' : 'rgba(60,140,255,0.28)';
  } else {
    ctx.fillStyle = hovered
      ? 'rgba(255,255,255,0.14)'
      : (settings.oled ? '#090b12' : 'rgba(14,20,38,0.92)');
  }
  ctx.fill();

  ctx.lineWidth = (active || primary || hovered) ? 2.4 : 1.5;
  ctx.strokeStyle = dpadFocused
    ? '#ffffff'
    : (primary ? '#ffffff' : (active || hovered ? pal.accent : 'rgba(140,175,240,0.32)'));
  ctx.stroke();

  if (dpadFocused) {
    roundRect(x - 3, y - 3, w + 6, h + 6, 14);
    ctx.strokeStyle = pal.accent;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  const labelColor = primary ? '#04060e' : (active ? '#ffffff' : 'rgba(210,228,255,0.92)');
  drawButtonLabelWithBigIcon(label, x + w / 2, y + h / 2 + (subLabel ? -2 : 5), primary ? 17 : 14, labelColor);

  if (subLabel) {
    ctx.textAlign = 'center';
    ctx.font = '600 10px ui-monospace, monospace';
    ctx.fillStyle = primary ? 'rgba(4,6,14,0.8)' : (active ? pal.accent : 'rgba(155,185,235,0.6)');
    ctx.fillText(subLabel, x + w / 2, y + h / 2 + 13);
  }
  ctx.restore();

  if (!disabled) registerButton(id, x, y, w, h, onClick);
}

function drawGitHubLogo(cx, cy, r, color = '#ffffff') {
  ctx.save();
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.08, r * 0.62, 0, Math.PI * 2);
  ctx.fill();
  // Cat ears
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.52, cy - r * 0.35);
  ctx.lineTo(cx - r * 0.62, cy - r * 0.85);
  ctx.lineTo(cx - r * 0.16, cy - r * 0.60);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.52, cy - r * 0.35);
  ctx.lineTo(cx + r * 0.62, cy - r * 0.85);
  ctx.lineTo(cx + r * 0.16, cy - r * 0.60);
  ctx.closePath();
  ctx.fill();
  // Torso base
  roundRect(cx - r * 0.34, cy + r * 0.32, r * 0.68, r * 0.58, r * 0.2);
  ctx.fill();
  // Octocat tail
  ctx.lineWidth = Math.max(1.8, r * 0.22);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.28, cy + r * 0.64);
  ctx.quadraticCurveTo(cx - r * 0.85, cy + r * 0.62, cx - r * 0.72, cy + r * 0.20);
  ctx.stroke();
  ctx.restore();
}

function drawInstagramLogo(cx, cy, r, color = '#ffffff') {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(1.8, r * 0.2);
  const sz = r * 1.48;
  roundRect(cx - sz / 2, cy - sz / 2, sz, sz, sz * 0.28);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.36, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + r * 0.42, cy - r * 0.42, Math.max(1.4, r * 0.11), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSocialButton(id, platform, label, x, y, w, h, onClick) {
  const bw = isBwTheme();
  const hovered = hoverBtnId === id;
  ctx.save();
  roundRect(x, y, w, h, bw ? 3 : 10);

  if (bw) {
    ctx.fillStyle = hovered ? '#ffffff' : '#000000';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.8;
    ctx.stroke();
  } else if (platform === 'github') {
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, hovered ? '#343b46' : '#24292e');
    g.addColorStop(1, '#161b22');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = hovered ? '#f0f6fc' : '#6e7681';
    ctx.lineWidth = hovered ? 2.2 : 1.5;
    ctx.stroke();
  } else {
    const g = ctx.createLinearGradient(x, y + h, x + w, y);
    g.addColorStop(0, '#f09433');
    g.addColorStop(0.25, '#e6683c');
    g.addColorStop(0.5, '#dc2743');
    g.addColorStop(0.75, '#cc2366');
    g.addColorStop(1, '#bc1888');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = hovered ? '#ffffff' : 'rgba(255,255,255,0.55)';
    ctx.lineWidth = hovered ? 2.2 : 1.5;
    ctx.stroke();
  }

  const fg = (bw && hovered) ? '#000000' : '#ffffff';
  const iconR = Math.min(h * 0.34, 11);

  if (label) {
    ctx.font = '700 12px ui-monospace, SFMono-Regular, Menlo, monospace';
    const tw = ctx.measureText(label).width;
    const totalW = iconR * 2 + 8 + tw;
    const startX = x + (w - totalW) / 2;
    const iconCX = startX + iconR;
    const iconCY = y + h / 2;
    if (platform === 'github') drawGitHubLogo(iconCX, iconCY, iconR, fg);
    else drawInstagramLogo(iconCX, iconCY, iconR, fg);
    ctx.textAlign = 'left';
    ctx.fillStyle = fg;
    ctx.fillText(label, startX + iconR * 2 + 8, y + h / 2 + 4);
  } else {
    if (platform === 'github') drawGitHubLogo(x + w / 2, y + h / 2, iconR, fg);
    else drawInstagramLogo(x + w / 2, y + h / 2, iconR, fg);
  }

  ctx.restore();
  registerButton(id, x, y, w, h, onClick);
}

function getSettingsLayoutMetrics() {
  const s = getActiveAppScale();
  const padX = isPortrait ? 18 : Math.max(24, Math.round(W * 0.05));
  const rowW = W - padX * 2 - 14;
  const stacked = (rowW / s) < 520;
  const baseRowH = isPortrait ? 64 : 58;
  const rowH = Math.round(baseRowH * (stacked ? 1.55 : 1) * s);
  const gap = Math.max(6, Math.round(10 * s));
  const listTop = 78;
  const listBottom = H - 78;
  const listH = Math.max(120, listBottom - listTop);
  return { s, padX, rowW, stacked, rowH, gap, listTop, listBottom, listH };
}

function ensureSettingsFocusVisible() {
  if (settingsFocus >= 12) return;
  const { rowH, gap, listH } = getSettingsLayoutMetrics();
  const itemTop = settingsFocus * (rowH + gap);
  const itemBottom = itemTop + rowH;
  if (itemTop < settingsScrollY) {
    settingsScrollY = itemTop;
  } else if (itemBottom > settingsScrollY + listH) {
    settingsScrollY = itemBottom - listH;
  }
}

  // Filter out any list buttons that scrolled outside the visible list viewport
  for (let i = uiButtons.length - 1; i >= buttonsBeforeList; i--) {
    const b = uiButtons[i];
    if (b.y + b.h < listTop || b.y > listBottom) {

  ctx.restore();
}

function drawRickrollFullScreen() {
  if (!rickrollActive) return;
  const pal = PALETTES[settings.paletteIdx];
  const bw = isBwTheme();
  const curNote = RICKROLL_MELODY[rickrollNoteIdx] || RICKROLL_MELODY[0];
  const activeLine = curNote.line || 0;

  ctx.save();
  ctx.fillStyle = (settings.oled || bw) ? '#000000' : '#050814';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = bw ? '#ffffff' : pal.accent;
  ctx.lineWidth = 2.5;
  ctx.strokeRect(6, 6, W - 12, H - 12);

  const startY = isPortrait ? 90 : 58;
  const lineGap = isPortrait ? 36 : 32;

  for (let i = 0; i < RICKROLL_LYRICS.length; i++) {
    const isCurrent = i === activeLine;
    const isPast = i < activeLine;
    ctx.textAlign = 'center';
    ctx.font = `${isCurrent ? '900' : '700'} ${isPortrait ? (isCurrent ? 18 : 15) : (isCurrent ? 24 : 19)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    if (bw) {
      ctx.fillStyle = isCurrent ? '#ffffff' : (isPast ? 'rgba(255,255,255,0.65)' : 'rgba(255,255,255,0.35)');
    } else {
      ctx.fillStyle = isCurrent
        ? pal.accent
        : (isPast ? '#ffffff' : 'rgba(170,200,255,0.38)');
    }
    const bounce = isCurrent ? Math.sin(uiTime * 18) * 3 : 0;
    ctx.fillText(RICKROLL_LYRICS[i], W / 2, startY + i * lineGap + bounce);
  }

  const frameIdx = Math.floor(uiTime * 6.5) % RICK_ASCII_FRAMES.length;
  const frame = RICK_ASCII_FRAMES[frameIdx];
  const asciiStartY = startY + RICKROLL_LYRICS.length * lineGap + (isPortrait ? 38 : 26);
  const asciiLineH = isPortrait ? 20 : 19;
  const swayX = Math.sin(uiTime * 6.5) * 14;

  ctx.textAlign = 'center';
  ctx.font = `700 ${isPortrait ? 16 : 16}px ui-monospace, SFMono-Regular, Menlo, Courier, monospace`;
  ctx.fillStyle = bw ? '#ffffff' : pal.secondary;

  for (let r = 0; r < frame.length; r++) {
    ctx.fillText(frame[r], W / 2 + swayX, asciiStartY + r * asciiLineH);
  }

  const floorY = asciiStartY + frame.length * asciiLineH + 6;
  ctx.strokeStyle = bw ? '#ffffff' : hexToRgba(pal.accent, 0.5);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 140, floorY);
  ctx.lineTo(W / 2 + 140, floorY);
  ctx.stroke();

  ctx.restore();
}

function getGameplayClusterTransform() {
  const rawS = getActiveAppScale();
  const clusterW = isPortrait ? (BOARD_W + 190) : (BOARD_W + 390);
  const clusterH = isPortrait ? (BOARD_H + 90) : (BOARD_H + 60);
  const showTouch = isTouchVisible();
  const availW = W - 16;
  const availH = showTouch && isPortrait ? (H - 300) : (H - 70);
  const maxSafeScale = Math.max(0.5, Math.min(availW / clusterW, availH / clusterH));
  const effScale = Math.min(rawS, maxSafeScale);
  const cx = BOARD_X + BOARD_W / 2;
  const cy = BOARD_Y + BOARD_H / 2;
  return { scale: effScale, cx, cy };
}

function render() {
  uiButtons = [];

  if (rickrollActive) {
    drawRickrollFullScreen();
    return;
  }

  if (noZenIntroActive) {
    drawNoZenIntroOverlay();
    return;
  }

  if (matrixTerminalActive) {
    drawMatrixTerminalOverlay();
    return;
  }

  if (touchEditorOpen) {
    drawTouchLayoutEditorModal();
    return;
  }

  if (firstRunNameOpen) {
    drawFirstRunNameModal();
    return;
  }

  if (settingsOpen) {
    drawSettingsModal();
    return;
  }

  if (highScoresOpen) {
    drawHighScoresModal();
    return;
  }

  if (highScorePromptOpen) {
    drawHighScorePromptModal();
    return;
  }

  if (state.phase === 'title') {
    drawTitleOverlay();
    return;
  }

  if (state.phase === 'paused') {
    drawPauseOverlay();
    return;
  }

  if (state.phase === 'gameover') {
    drawGameOverOverlay();
    return;
  }

  drawBackground();

  const tr = getGameplayClusterTransform();
  ctx.save();
  ctx.translate(tr.cx, tr.cy);
  ctx.scale(tr.scale, tr.scale);
  ctx.translate(-tr.cx, -tr.cy);

  drawBoard();
  drawHoldPanel();
  drawNextPanel();
  if (CONFIG.zoneEnabled) drawFocusGauge();
  drawStats();
  drawToast();

  if (state.phase === 'countdown') {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '800 110px system-ui, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(String(Math.max(1, Math.ceil(state.countdown))), BOARD_X + BOARD_W / 2, BOARD_Y + BOARD_H / 2 + 38);
    ctx.restore();
  }

  ctx.restore();

  drawPortraitTopStatsBar();
  drawHudTopButtons();
  drawTouchControls();

  if (state.zoneFlash > 0 && !isBwTheme()) {
    ctx.save();
    ctx.globalAlpha = state.zoneFlash * 0.2;
    ctx.fillStyle = PALETTES[settings.paletteIdx].zone;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

/* =========================================================
   INPUT — POINTER, TOUCH, KEYBOARD, GAMEPAD & BACK GUARD
   ========================================================= */
function recordBackSpam() {
  if (rickrollActive || noZenIntroActive) return false;
  const now = performance.now();
  if (now - backSpamTimer > 1800) backSpamCount = 0;
  backSpamCount++;
  backSpamTimer = now;
  if (backSpamCount >= 5) {
    backSpamCount = 0;
    matrixTerminalActive = true;
    matrixTimer = 0;
    matrixColumns = [];
    matrixInactivityTimer = 0;
    matrixHintAlpha = 1;
    return true;
  }
  return false;
}

function handleBackNavigation() {
  if (rickrollActive || noZenIntroActive) return true;

  // Exit Matrix first — never let a back-spam re-arm it while it's on.
  if (matrixTerminalActive) {
    matrixTerminalActive = false;
    matrixColumns = [];
    return true;
  }

  if (recordBackSpam()) return true;
  if (touchEditorOpen) {
    touchEditorOpen = false;
    draggingTouchBtnId = null;
    saveSettings();
    return true;
  }
  if (settingsOpen) {
    cancelSettingsModal();
    return true;
  }
  if (highScoresOpen) {
    highScoresOpen = false;
    return true;
  }
  if (highScorePromptOpen) {
    highScorePromptOpen = false;
    closeTextInput();
    return true;
  }
  if (state.phase === 'playing') {
    state.phase = 'paused';
    pauseFocus = 0;
    return true;
  }
  if (state.phase === 'paused') {
    state.phase = 'playing';
    return true;
  }
  if (state.phase === 'gameover') {
    state.phase = 'title';
    secretSuperSpeedMode = false;
    return true;
  }
  return false;
}

try {
  history.pushState({ disconnectedGuard: true }, '');
  window.addEventListener('popstate', () => {
    handleBackNavigation();
    try { history.pushState({ disconnectedGuard: true }, ''); } catch (_) {}
  });
} catch (_) {}
document.addEventListener('backbutton', e => {
  e.preventDefault();
  handleBackNavigation();
}, false);

function canvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (W / Math.max(1, rect.width)),
    y: (clientY - rect.top) * (H / Math.max(1, rect.height)),
  };
}

function updateScaleFromPointer(px) {
  const r = dragSliderTrack || scaleSliderRect;
  if (!r) return;
  const pct = Math.max(0, Math.min(1, (px - r.x) / Math.max(1, r.w)));
  const raw = 50 + pct * 450;
  settings.appScale = Math.max(50, Math.min(500, Math.round(raw / 5) * 5));
}

function triggerTouchAction(action) {
  if (state.phase !== 'playing') return;
  if (action === 'cw') rotate(1);
  else if (action === 'ccw') rotate(-1);
  else if (action === 'drop') hardDrop();
  else if (action === 'hold') holdPiece();
  else if (action === 'zone') activateFocus();
}

function isPointOnTextInput(x, y) {
  const inputBoxIds = ['hsp_name_box', 'set_defname_input', 'first_name_box'];
  for (const b of uiButtons) {
    if (inputBoxIds.includes(b.id) && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      return true;
    }
  }
  return false;
}

canvas.addEventListener('mousedown', e => {
  const { x, y } = canvasCoords(e.clientX, e.clientY);

  if (textInputTarget) {
    if (isPointOnTextInput(x, y)) {
      e.preventDefault();
    } else {
      closeTextInput();
    }
  }

  if (touchEditorOpen) {
    for (let i = uiButtons.length - 1; i >= 0; i--) {
      const b = uiButtons[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        b.onClick();
        return;
      }
    }
    for (let i = touchPadButtons.length - 1; i >= 0; i--) {
      const tb = touchPadButtons[i];
      if (x >= tb.x && x <= tb.x + tb.w && y >= tb.y && y <= tb.y + tb.h) {
        draggingTouchBtnId = tb.id;
        dragTouchOffsetX = x - tb.x;
        dragTouchOffsetY = y - tb.y;
        return;
      }
    }
    return;
  }

  if (settingsOpen && scaleSliderRect) {
    const r = scaleSliderRect;
    if (x >= r.x - 10 && x <= r.x + r.w + 10 && y >= r.y && y <= r.y + r.h) {
      draggingScaleSlider = true;
      dragSliderTrack = { ...r };
      settingsFocus = 10;
      updateScaleFromPointer(x);
      return;
    }
  }

  let startedDragInViewport = false;
  if (settingsOpen && settingsViewport) {
    const vp = settingsViewport;
    if (x >= vp.x && x <= vp.x + vp.w && y >= vp.y && y <= vp.y + vp.h) {
      draggingSettingsList = true;
      settingsDragStartY = y;
      settingsDragStartScroll = settingsScrollY;
      settingsDragMoved = false;
      startedDragInViewport = true;
    }
  }

  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      if (b._isListButton && settingsViewport) {
        const vp = settingsViewport;
        if (y < vp.y || y > vp.y + vp.h) continue;
      }
      if (startedDragInViewport) {
        pendingSettingsButton = b;
        return;
      }
      b.onClick();
      return;
    }
  }

  if (isTouchVisible() && state.phase === 'playing') {
    for (const tb of touchPadButtons) {
      if (x >= tb.x && x <= tb.x + tb.w && y >= tb.y && y <= tb.y + tb.h) {
        if (tb.hold) touchHeld[tb.hold] = true;
        if (tb.action) triggerTouchAction(tb.action);
        return;
      }
    }
  }
});

window.addEventListener('mousemove', e => {
  if (matrixTerminalActive) matrixInteract();

  const { x, y } = canvasCoords(e.clientX, e.clientY);

  if (touchEditorOpen && draggingTouchBtnId) {
    const tb = touchPadButtons.find(b => b.id === draggingTouchBtnId);
    if (tb) {
      const nx = Math.max(4, Math.min(W - tb.w - 4, x - dragTouchOffsetX)) / W;
      const ny = Math.max(4, Math.min(H - tb.h - 4, y - dragTouchOffsetY)) / H;
      const orientKey = isPortrait ? 'portrait' : 'landscape';
      if (!customTouchPositions[orientKey]) customTouchPositions[orientKey] = {};
      customTouchPositions[orientKey][tb.id] = { nx, ny };
    }
    return;
  }

  if (draggingScaleSlider) {
    updateScaleFromPointer(x);
    return;
  }

  if (draggingSettingsList) {
    const dy = y - settingsDragStartY;
    if (Math.abs(dy) > 5) settingsDragMoved = true;
    settingsScrollY = Math.max(0, Math.min(settingsMaxScroll, settingsDragStartScroll - dy));
    return;
  }

  hoverBtnId = null;
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      hoverBtnId = b.id;
      break;
    }
  }
});

window.addEventListener('mouseup', e => {
  if (pendingSettingsButton) {
    if (!settingsDragMoved) {
      const { x, y } = canvasCoords(e.clientX, e.clientY);
      const b = pendingSettingsButton;
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        if (!b._isListButton || !settingsViewport ||
            (y >= settingsViewport.y && y <= settingsViewport.y + settingsViewport.h)) {
          b.onClick();
        }
      }
    }
    pendingSettingsButton = null;
  }
  draggingScaleSlider = false;
  dragSliderTrack = null;
  draggingSettingsList = false;
  settingsDragMoved = false;
  draggingTouchBtnId = null;
  touchHeld.left = touchHeld.right = touchHeld.down = false;
});

canvas.addEventListener('wheel', e => {
  if (settingsOpen) {
    e.preventDefault();
    settingsScrollY = Math.max(0, Math.min(settingsMaxScroll, settingsScrollY + e.deltaY * 0.6));
  } else if (highScoresOpen) {
    e.preventDefault();
    highScoresScrollY = Math.max(0, Math.min(highScoresMaxScroll, highScoresScrollY + e.deltaY * 0.6));
  }
}, { passive: false });

function syncActiveTouches(touches) {
  touchHeld.left = touchHeld.right = touchHeld.down = false;
  if (!isTouchVisible() || state.phase !== 'playing') return;
  for (let i = 0; i < touches.length; i++) {
    const { x, y } = canvasCoords(touches[i].clientX, touches[i].clientY);
    for (const tb of touchPadButtons) {
      if (tb.hold && x >= tb.x && x <= tb.x + tb.w && y >= tb.y && y <= tb.y + tb.h) {
        touchHeld[tb.hold] = true;
      }
    }
  }
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  lastInputDevice = 'touch';
  requestMotionPermissionIfNeeded();

  const touch = e.changedTouches[0];
  if (!touch) return;
  const { x, y } = canvasCoords(touch.clientX, touch.clientY);

  if (textInputTarget) {
    if (!isPointOnTextInput(x, y)) {
      closeTextInput();
    }
  }

  if (touchEditorOpen) {
    for (let i = uiButtons.length - 1; i >= 0; i--) {
      const b = uiButtons[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        b.onClick();
        return;
      }
    }
    for (let i = touchPadButtons.length - 1; i >= 0; i--) {
      const tb = touchPadButtons[i];
      if (x >= tb.x && x <= tb.x + tb.w && y >= tb.y && y <= tb.y + tb.h) {
        draggingTouchBtnId = tb.id;
        dragTouchOffsetX = x - tb.x;
        dragTouchOffsetY = y - tb.y;
        return;
      }
    }
    return;
  }

  if (settingsOpen && scaleSliderRect) {
    const r = scaleSliderRect;
    if (x >= r.x - 12 && x <= r.x + r.w + 12 && y >= r.y && y <= r.y + r.h) {
      draggingScaleSlider = true;
      dragSliderTrack = { ...r };
      settingsFocus = 10;
      updateScaleFromPointer(x);
      return;
    }
  }

  let startedDragInViewport = false;
  if (settingsOpen && settingsViewport) {
    const vp = settingsViewport;
    if (x >= vp.x && x <= vp.x + vp.w && y >= vp.y && y <= vp.y + vp.h) {
      draggingSettingsList = true;
      settingsDragStartY = y;
      settingsDragStartScroll = settingsScrollY;
      settingsDragMoved = false;
      startedDragInViewport = true;
    }
  }

  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      if (b._isListButton && settingsViewport) {
        const vp = settingsViewport;
        if (y < vp.y || y > vp.y + vp.h) continue;
      }
      if (startedDragInViewport) {
        pendingSettingsButton = b;
        return;
      }
      b.onClick();
      return;
    }
  }

  if (state.phase === 'playing') {
    for (let tIdx = 0; tIdx < e.changedTouches.length; tIdx++) {
      const pt = canvasCoords(e.changedTouches[tIdx].clientX, e.changedTouches[tIdx].clientY);
      for (const tb of touchPadButtons) {
        if (tb.action && pt.x >= tb.x && pt.x <= tb.x + tb.w && pt.y >= tb.y && pt.y <= tb.y + tb.h) {
          triggerTouchAction(tb.action);
        }
      }
    }
    syncActiveTouches(e.touches);
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const touch = e.touches[0];
  if (!touch) return;
  const { x, y } = canvasCoords(touch.clientX, touch.clientY);

  if (touchEditorOpen && draggingTouchBtnId) {
    const tb = touchPadButtons.find(b => b.id === draggingTouchBtnId);
    if (tb) {
      const nx = Math.max(4, Math.min(W - tb.w - 4, x - dragTouchOffsetX)) / W;
      const ny = Math.max(4, Math.min(H - tb.h - 4, y - dragTouchOffsetY)) / H;
      const orientKey = isPortrait ? 'portrait' : 'landscape';
      if (!customTouchPositions[orientKey]) customTouchPositions[orientKey] = {};
      customTouchPositions[orientKey][tb.id] = { nx, ny };
    }
    return;
  }

  if (draggingScaleSlider) {
    updateScaleFromPointer(x);
    return;
  }

  if (draggingSettingsList) {
    const dy = y - settingsDragStartY;
    if (Math.abs(dy) > 6) settingsDragMoved = true;
    settingsScrollY = Math.max(0, Math.min(settingsMaxScroll, settingsDragStartScroll - dy));
    return;
  }

  syncActiveTouches(e.touches);
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();

  if (pendingSettingsButton) {
    if (!settingsDragMoved) {
      const touch = e.changedTouches[0];
      if (touch) {
        const { x, y } = canvasCoords(touch.clientX, touch.clientY);
        const b = pendingSettingsButton;
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
          if (!b._isListButton || !settingsViewport ||
              (y >= settingsViewport.y && y <= settingsViewport.y + settingsViewport.h)) {
            b.onClick();
          }
        }
      }
    }
    pendingSettingsButton = null;
  }

  draggingScaleSlider = false;
  dragSliderTrack = null;
  draggingSettingsList = false;
  settingsDragMoved = false;
  draggingTouchBtnId = null;
  syncActiveTouches(e.touches);
}, { passive: false });

// Device shake (mobile) re-shows the Matrix hint.
window.addEventListener('devicemotion', e => {
  if (!matrixTerminalActive) return;
  let a = e.acceleration;
  if (!a || (a.x === null && a.y === null && a.z === null)) {
    a = e.accelerationIncludingGravity;
  }
  if (!a) return;
  const mag = Math.sqrt((a.x||0)*(a.x||0) + (a.y||0)*(a.y||0) + (a.z||0)*(a.z||0));
  const now = performance.now();
  if (mag > 18 && now - matrixLastShakeTime > 250) {
    matrixLastShakeTime = now;
    matrixInteract();
  }
}, { passive: true });

function handleMenuDpad(dir) {
  if (firstRunNameOpen) {
    if (dir === 'select') commitFirstRunUsername();
    return;
  }

  if (touchEditorOpen) {
    if (dir === 'back' || dir === 'select') {
      touchEditorOpen = false;
      saveSettings();
    }
    return;
  }

  if (settingsOpen) {
    if (dir === 'back') { cancelSettingsModal(); return; }
    if (dir === 'up') {
      settingsFocus = (settingsFocus + 13) % 14;
      ensureSettingsFocusVisible();
    } else if (dir === 'down') {
      settingsFocus = (settingsFocus + 1) % 14;
      ensureSettingsFocusVisible();
    } else if (dir === 'left' || dir === 'right') {
      const step = dir === 'right' ? 1 : -1;
      if (settingsFocus === 0) endlessMode = !endlessMode;
      else if (settingsFocus === 1) { zenMode = !zenMode; triggerZenToggleEasterEggCheck(); }
      else if (settingsFocus === 2) settings.assists = !settings.assists;
      else if (settingsFocus === 3 && !endlessMode) adjustLineGoal(step);
      else if (settingsFocus === 4) adjustStartLevel(step);
      else if (settingsFocus === 5) settings.alwaysUseDefaultName = !settings.alwaysUseDefaultName;
      else if (settingsFocus === 6) { settings.oled = !settings.oled; document.body.classList.toggle('oled-mode', settings.oled); }
      else if (settingsFocus === 7) applyPalette(settings.paletteIdx + step);
      else if (settingsFocus === 8 && isMonoTheme()) {
        settings.monoAccentIdx = (settings.monoAccentIdx + step + MONO_ACCENTS.length) % MONO_ACCENTS.length;
        updateMonoPaletteColors();
        applyPalette(settings.paletteIdx);
      } else if (settingsFocus === 9) {
        const list = ['auto', 'landscape', 'portrait'];
        settings.orientation = list[(list.indexOf(settings.orientation) + step + 3) % 3];
        updateLayout();
      } else if (settingsFocus === 10) {
        settings.appScale = Math.max(50, Math.min(500, settings.appScale + step * 5));
      } else if (settingsFocus === 11) {
        const list = ['auto', 'on', 'off'];
        settings.touchControls = list[(list.indexOf(settings.touchControls) + step + 3) % 3];
        updateLayout();
      } else if (settingsFocus === 12 || settingsFocus === 13) {
        settingsFocus = settingsFocus === 12 ? 13 : 12;
      }
    } else if (dir === 'select') {
      if (settingsFocus === 0) endlessMode = !endlessMode;
      else if (settingsFocus === 1) { zenMode = !zenMode; triggerZenToggleEasterEggCheck(); }
      else if (settingsFocus === 2) settings.assists = !settings.assists;
      else if (settingsFocus === 5) {
        if (textInputTarget === 'defaultName') closeTextInput();
        else openTextInput('defaultName');
      } else if (settingsFocus === 6) { settings.oled = !settings.oled; document.body.classList.toggle('oled-mode', settings.oled); }
      else if (settingsFocus === 11) { touchEditorOpen = true; }
      else if (settingsFocus === 12) saveAndCloseSettingsModal();
      else if (settingsFocus === 13) cancelSettingsModal();
    }
    return;
  }

  if (highScoresOpen) {
    if (dir === 'up') highScoresScrollY = Math.max(0, highScoresScrollY - 40);
    else if (dir === 'down') highScoresScrollY = Math.min(highScoresMaxScroll, highScoresScrollY + 40);
    else if (dir === 'select' || dir === 'back') highScoresOpen = false;
    return;
  }

  if (highScorePromptOpen) {
    if (dir === 'up' || dir === 'left') hsPromptFocus = (hsPromptFocus + 2) % 3;
    else if (dir === 'down' || dir === 'right') hsPromptFocus = (hsPromptFocus + 1) % 3;
    else if (dir === 'select') {
      if (hsPromptFocus === 0) openTextInput('hsName');
      else if (hsPromptFocus === 1) commitHighScoreRecord();
      else { highScorePromptOpen = false; closeTextInput(); }
    } else if (dir === 'back') {
      highScorePromptOpen = false;
      closeTextInput();
    }
    return;
  }

  if (state.phase === 'title') {
    if (dir === 'up') titleFocus = (titleFocus + 7) % 8;
    else if (dir === 'down') titleFocus = (titleFocus + 1) % 8;
    else if (dir === 'left' || dir === 'right') {
      const step = dir === 'right' ? 1 : -1;
      if (titleFocus <= 2) titleFocus = (titleFocus + step + 3) % 3;
      else if (titleFocus === 3 && !endlessMode) adjustLineGoal(step);
      else if (titleFocus === 4) { adjustStartLevel(step); saveSettings(); }
      else if (titleFocus >= 5) {
        const order = [6, 5, 7];
        const curIdx = Math.max(0, order.indexOf(titleFocus));
        titleFocus = order[(curIdx + step + 3) % 3];
      }
    } else if (dir === 'select') {
      if (titleFocus === 0) { endlessMode = false; saveSettings(); }
      else if (titleFocus === 1) { endlessMode = true; saveSettings(); }
      else if (titleFocus === 2) { zenMode = !zenMode; triggerZenToggleEasterEggCheck(); saveSettings(); }
      else if (titleFocus === 5) startGame();
      else if (titleFocus === 6) { highScoresScrollY = 0; highScoresOpen = true; }
      else if (titleFocus === 7) openSettingsModal();
    }
    return;
  }

  if (state.phase === 'paused') {
    if (dir === 'up') pauseFocus = (pauseFocus + 3) % 4;
    else if (dir === 'down') pauseFocus = (pauseFocus + 1) % 4;
    else if (dir === 'select') {
      if (pauseFocus === 0) state.phase = 'playing';
      else if (pauseFocus === 1) openSettingsModal();
      else if (pauseFocus === 2) startGame();
      else if (pauseFocus === 3) { state.phase = 'title'; secretSuperSpeedMode = false; }
    } else if (dir === 'back') {
      state.phase = 'playing';
    }
    return;
  }

  if (state.phase === 'gameover') {
    if (dir === 'up') gameOverFocus = (gameOverFocus + 3) % 4;
    else if (dir === 'down') gameOverFocus = (gameOverFocus + 1) % 4;
    else if (dir === 'select') {
      if (gameOverFocus === 0) startGame();
      else if (gameOverFocus === 1) openSettingsModal();
      else if (gameOverFocus === 2) { highScoresScrollY = 0; highScoresOpen = true; }
      else if (gameOverFocus === 3) { state.phase = 'title'; secretSuperSpeedMode = false; }
    } else if (dir === 'back') {
      state.phase = 'title';
      secretSuperSpeedMode = false;
    }
  }
}

window.addEventListener('keydown', e => {
  lastInputDevice = 'keyboard';
  const code = e.code;

  if (rickrollActive || noZenIntroActive) {
    e.preventDefault();
    return;
  }

  if (matrixTerminalActive) {
    e.preventDefault();
    matrixTerminalActive = false;
    matrixColumns = [];
    return;
  }

  if (textInputTarget) {
    // Keep the hidden input focused, in case the browser blurred it.
    if (document.activeElement !== hiddenInput) {
      try {
        hiddenInput.focus();
        hiddenInput.setSelectionRange(hiddenInput.value.length, hiddenInput.value.length);
      } catch (_) {}
    }
    if (code === 'Enter') {
      e.preventDefault();
      if (firstRunNameOpen) commitFirstRunUsername();
      else if (highScorePromptOpen) commitHighScoreRecord();
      else closeTextInput();
      return;
    }
    if (code === 'Escape') {
      e.preventDefault();
      const wasDefault = textInputTarget === 'defaultName';
      closeTextInput();
      if (!wasDefault) handleBackNavigation();
      return;
    }
    return;
  }

  if (code === 'Escape' || code === 'BrowserBack') {
    e.preventDefault();
    handleBackNavigation();
    return;
  }

  const inMenu = firstRunNameOpen || touchEditorOpen || settingsOpen || highScoresOpen || highScorePromptOpen ||
    state.phase === 'title' || state.phase === 'paused' || state.phase === 'gameover';

  if (inMenu) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(code)) {
      e.preventDefault();
    }
    if (code === 'ArrowUp' || code === 'KeyW') handleMenuDpad('up');
    else if (code === 'ArrowDown' || code === 'KeyS') handleMenuDpad('down');
    else if (code === 'ArrowLeft' || code === 'KeyA') handleMenuDpad('left');
    else if (code === 'ArrowRight' || code === 'KeyD') handleMenuDpad('right');
    else if (code === 'Enter' || code === 'Space') handleMenuDpad('select');
    return;
  }

  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyP','KeyR','KeyC','KeyQ','KeyZ','KeyX'].includes(code)) {
    e.preventDefault();
  }

  if (e.repeat) return;

  if (code === 'KeyP') {
    if (state.phase === 'playing') { state.phase = 'paused'; pauseFocus = 0; }
    else if (state.phase === 'paused') state.phase = 'playing';
    return;
  }
  if (code === 'KeyR') { startGame(); return; }

  if (state.phase !== 'playing') return;

  switch (code) {
    case 'ArrowLeft': case 'KeyA': kb.left = true; break;
    case 'ArrowRight': case 'KeyD': kb.right = true; break;
    case 'ArrowDown': case 'KeyS': kb.down = true; break;
    case 'ArrowUp': case 'KeyX': case 'KeyW': rotate(1); break;
    case 'KeyZ': case 'ControlLeft': case 'ControlRight': rotate(-1); break;
    case 'Space': hardDrop(); break;
    case 'KeyC': case 'ShiftLeft': case 'ShiftRight': holdPiece(); break;
    case 'KeyQ': case 'KeyE': activateFocus(); break;
  }
});

window.addEventListener('keyup', e => {
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': kb.left = false; break;
    case 'ArrowRight': case 'KeyD': kb.right = false; break;
    case 'ArrowDown': case 'KeyS': kb.down = false; break;
  }
});

window.addEventListener('blur', () => {
  kb.left = kb.right = kb.down = false;
  touchHeld.left = touchHeld.right = touchHeld.down = false;
  if (state.phase === 'playing') state.phase = 'paused';
});

/* =========================================================
   INPUT — GAMEPAD
   ========================================================= */
let gpIndex = null;
let gpPrev = [];
let gpMenuRepeatTimer = 0;

window.addEventListener('gamepadconnected', e => {
  gpIndex = e.gamepad.index;
  gpPrev = [];
});
window.addEventListener('gamepaddisconnected', e => {
  if (gpIndex === e.gamepad.index) {
    gpIndex = null;
    gpPrev = [];
  }
});

function pollGamepad(dt) {
  gpb.left = gpb.right = gpb.down = false;

  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  if (gpIndex !== null) gp = pads[gpIndex];
  if (!gp || !gp.connected) {
    gp = null;
    for (const p of pads) {
      if (p && p.connected) { gp = p; gpIndex = p.index; break; }
    }
  }
  if (!gp) { gpPrev = []; return; }

  const btn = i => {
    const b = gp.buttons[i];
    return !!b && (b.pressed || b.value > 0.5);
  };
  const pressed = i => btn(i) && !gpPrev[i];

  const anyBtn = gp.buttons.some(b => b.pressed || b.value > 0.5);
  const anyAxis = gp.axes.some(a => Math.abs(a) > 0.35);
  if (anyBtn || anyAxis) lastInputDevice = 'gamepad';

  if (rickrollActive || noZenIntroActive) {
    gpPrev = gp.buttons.map(b => b.pressed || b.value > 0.5);
    return;
  }

  // Matrix terminal: any button exits, stick activity restores the hint.
  if (matrixTerminalActive) {
    if (gp.axes.some(a => Math.abs(a) > 0.35)) matrixInteract();
    if (anyBtn) {
      matrixTerminalActive = false;
      matrixColumns = [];
    }
    gpPrev = gp.buttons.map(b => b.pressed || b.value > 0.5);
    return;
  }

  const rx = gp.axes[2] || 0;
  const ry = gp.axes[3] || 0;
  if (Math.abs(ry) > 0.25) {
    if (settingsOpen) {
      settingsScrollY = Math.max(0, Math.min(settingsMaxScroll, settingsScrollY + ry * 420 * dt));
    } else if (highScoresOpen) {
      highScoresScrollY = Math.max(0, Math.min(highScoresMaxScroll, highScoresScrollY + ry * 420 * dt));
    }
  }

  const inMenu = firstRunNameOpen || touchEditorOpen || settingsOpen || highScoresOpen || highScorePromptOpen ||
    state.phase === 'title' || state.phase === 'paused' || state.phase === 'gameover';

  if (inMenu) {
    const lx = gp.axes[0] || 0;
    const ly = gp.axes[1] || 0;
    let stickDir = null;
    if (ly < -0.5) stickDir = 'up';
    else if (ly > 0.5) stickDir = 'down';
    else if (lx < -0.5) stickDir = 'left';
    else if (lx > 0.5) stickDir = 'right';

    if (stickDir) {
      gpMenuRepeatTimer -= dt;
      if (gpMenuRepeatTimer <= 0) {
        handleMenuDpad(stickDir);
        gpMenuRepeatTimer = 0.18;
      }
    } else {
      gpMenuRepeatTimer = 0;
    }

    if (pressed(12)) handleMenuDpad('up');
    if (pressed(13)) handleMenuDpad('down');
    if (pressed(14)) handleMenuDpad('left');
    if (pressed(15)) handleMenuDpad('right');
    if (pressed(0) || pressed(9)) handleMenuDpad('select');
    if (pressed(1)) handleBackNavigation();

    gpPrev = gp.buttons.map(b => b.pressed || b.value > 0.5);
    return;
  }

  if (pressed(9)) {
    if (state.phase === 'playing') { state.phase = 'paused'; pauseFocus = 0; }
    else if (state.phase === 'paused') state.phase = 'playing';
  }
  if (pressed(8)) startGame();

  if (state.phase === 'playing') {
    gpb.left  = btn(14) || (gp.axes[0] || 0) < -0.45;
    gpb.right = btn(15) || (gp.axes[0] || 0) >  0.45;
    gpb.down  = btn(13) || (gp.axes[1] || 0) >  0.45;

    if (pressed(12)) hardDrop();
    if (pressed(0)) rotate(-1);
    if (pressed(1)) rotate(1);
    if (pressed(4) || pressed(5)) holdPiece();
    if (pressed(6) || pressed(7)) activateFocus();
  }

  gpPrev = gp.buttons.map(b => b.pressed || b.value > 0.5);
}

/* =========================================================
   FLOW & MAIN LOOP
   ========================================================= */
function adjustStartLevel(d) {
  startLevel = Math.max(1, Math.min(CONFIG.levelCap, startLevel + d));
}

function startGame() {
  // Clear any transient full-screen overlays that could otherwise block the run.
  matrixTerminalActive = false;
  matrixColumns = [];
  matrixInactivityTimer = 0;
  matrixHintAlpha = 1;
  rickrollActive = false;
  rickrollNoteIdx = 0;
  rickrollNoteTimer = 0;
  noZenIntroActive = false;
  touchEditorOpen = false;
  draggingTouchBtnId = null;
  pendingSettingsButton = null;

  state.board = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
  state.buffer = Array.from({ length: BUFFER }, () => new Array(COLS).fill(null));
  state.cur = null;
  state.visualX = 0;
  state.visualY = 0;
  state.fallProgress = 0;
  state.dropTrail = null;
  state.hold = null;
  state.canHold = true;
  state.bag = [];
  state.nextQueue = [];
  state.score = 0;
  state.lines = 0;
  const effStart = secretSuperSpeedMode ? CONFIG.levelCap : startLevel;
  state.startLevel = effStart;
  state.level = effStart;
  state.maxLevel = effStart;
  state.initialLineGoal = lineGoal;
  state.lineGoal = lineGoal;
  state.zenRun = zenMode;
  state.recordTimestamp = '';
  state.recordSaved = false;
  state.combo = -1;
  state.b2b = false;
  state.gravTimer = 0;
  state.lockTimer = 0;
  state.lockResets = 0;
  state.lastMoveRotate = false;
  state.lastKick = -1;
  state.lowestY = 0;
  state.countdown = CONFIG.countdown;
  state.softDrop = false;
  state.zone = 0;
  state.zoneActive = false;
  state.zoneFullCharge = false;
  state.zoneTimer = 0;
  state.zoneLines = 0;
  state.victory = false;
  state.time = 0;
  state.gameOverTimer = 0;
  state.flash = 0;
  state.zoneFlash = 0;
  state.toast = '';
  state.toastTimer = 0;
  dasDir = 0; dasTimer = 0; arrTimer = 0;
  kb.left = kb.right = kb.down = false;
  gpb.left = gpb.right = gpb.down = false;
  touchHeld.left = touchHeld.right = touchHeld.down = false;
  highScorePromptOpen = false;
  closeTextInput();
  ensureQueue();
  state.phase = 'countdown';
  spawn();
}

let lastTime = performance.now();
function loop(now) {
  const rawDt = (now - lastTime) / 1000;
  lastTime = now;
  if (rawDt > 0.0005 && rawDt < 0.25) {
    fpsSmooth = fpsSmooth * 0.92 + (1 / rawDt) * 0.08;
  }
  const dt = Math.min(0.05, Math.max(0.0001, rawDt));

  pollGamepad(dt);
  update(dt);
  render();

  requestAnimationFrame(loop);
}

loadSettings();
updateLayout();
state.board = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
state.buffer = Array.from({ length: BUFFER }, () => new Array(COLS).fill(null));
ensureQueue();
requestAnimationFrame(loop);

})();
</script>
